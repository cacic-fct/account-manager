<header class="page-header">
  <div class="header-content">
    <a class="brand" routerLink="/applications" aria-label="Conta CACiC — aplicativos">
      <app-cacic-logo class="logo" fillColor="currentColor" />
      <span>Conta CACiC</span>
    </a>
    <a mat-button routerLink="/applications"><mat-icon>apps</mat-icon>Aplicativos</a>
  </div>
</header>
<main class="navigation-page">
  <header class="page-heading">
    <h1>Configurações</h1>
    @if (currentUser(); as user) {
      <div class="account-identity">
        <span class="account-name">{{ displayName() }}</span>
        <span>{{ user.email }}</span>
      </div>
    }
  </header>
  <app-settings-navigation [groups]="groups" label="Configurações da conta" />
  <footer class="page-footer">
    <div class="header-actions">
      @if (isAdmin()) {
        <a mat-button routerLink="/admin"><mat-icon>admin_panel_settings</mat-icon>Administração</a>
      }
      <button mat-button type="button" (click)="logout()"><mat-icon>logout</mat-icon>Sair</button>
    </div>
  </footer>
</main>
