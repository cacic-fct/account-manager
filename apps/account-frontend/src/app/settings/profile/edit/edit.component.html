<div class="edit-profile-container">
  <header class="profile-header">
    <div>
      <h1>Editar perfil</h1>
    </div>
    <button
      mat-icon-button
      type="button"
      aria-label="Como tratamos seus dados"
      matTooltip="Como tratamos seus dados"
      (click)="dialog.open(dataHelp, { width: '600px', maxWidth: 'calc(100vw - 32px)' })">
      <mat-icon>help_outline</mat-icon>
    </button>
  </header>

  <app-profile-form
    [initialData]="initialFormData()"
    [identityFieldLocks]="identityFieldLocks()"
    [isEditMode]="true"
    [layoutMode]="'all-in-one'"
    [showCancel]="true"
    (cancelled)="cancel()"
    (savingChange)="onSavingChange($event)"
    (saveSuccess)="onProfileSaveSuccess($event)"
    (saveError)="onProfileSaveError($event)" />
</div>

<ng-template #dataHelp>
  <h2 mat-dialog-title>Como tratamos seus dados</h2>
  <mat-dialog-content><app-profile-data-help /></mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Fechar</button>
  </mat-dialog-actions>
</ng-template>
