<mat-card class="settings-card">
  <mat-card-header>
    <mat-card-title>Convite do servidor</mat-card-title>
    <mat-card-subtitle> Link usado quando estudantes conectam o Discord. </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (isLoading()) {
      <div class="loading-container">
        <mat-spinner diameter="32"></mat-spinner>
        <p>Carregando convite...</p>
      </div>
    } @else {
      <div class="invite-editor">
        <mat-form-field appearance="outline">
          <mat-label>Link de convite</mat-label>
          <input matInput [formControl]="inviteLinkControl" placeholder="https://discord.gg/..." type="url" />
          <mat-icon matSuffix>link</mat-icon>
        </mat-form-field>

        @if (inviteSetting()?.updatedAt) {
          <p class="last-updated">Atualizado em {{ inviteSetting()?.updatedAt | dateFns: 'Pp' }}</p>
        } @else {
          <p class="last-updated">O convite será criado ao salvar.</p>
        }
      </div>

      <div class="actions">
        <button mat-button (click)="refreshSettings()" [disabled]="isSaving()">
          <mat-icon>refresh</mat-icon>
          Atualizar
        </button>
        <button mat-button (click)="resetInviteLink()" [disabled]="isSaving() || !hasChanges()">
          <mat-icon>undo</mat-icon>
          Desfazer
        </button>
        <button mat-raised-button color="primary" (click)="saveInviteLink()" [disabled]="isSaving() || !hasChanges()">
          @if (isSaving()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            <mat-icon>save</mat-icon>
          }
          Salvar
        </button>
      </div>
    }
  </mat-card-content>
</mat-card>
