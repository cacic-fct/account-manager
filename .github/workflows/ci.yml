name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint affected projects
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Derive Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Lint affected projects
        run: bunx nx affected -t eslint:lint --parallel=3

  unit-tests:
    name: Unit tests (${{ matrix.project }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project:
          - account-backend
          - account-frontend
          - cookie-banner

    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Run unit tests
        run: bunx nx test ${{ matrix.project }}

  backend-e2e:
    name: Backend E2E
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Run mocked backend e2e tests with coverage
        run: bunx nx run account-backend:e2e-cov

      - name: Upload mocked backend e2e coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: e2e-account-backend
          files: coverage/apps/account-backend-e2e/lcov.info,coverage/apps/account-backend-e2e/coverage-final.json,coverage/apps/account-backend-e2e/clover.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  backend-auth-e2e:
    name: Backend auth E2E
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Run backend auth e2e tests with fresh Keycloak and coverage
        run: bun run e2e:backend:keycloak:cov

      - name: Upload Keycloak backend e2e coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: e2e-keycloak-account-backend
          files: coverage/apps/account-backend-keycloak-e2e/lcov.info,coverage/apps/account-backend-keycloak-e2e/coverage-final.json,coverage/apps/account-backend-keycloak-e2e/clover.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  backend-seaweedfs-integration:
    name: Backend SeaweedFS integration
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Run SeaweedFS integration tests with coverage
        run: bun run integration:backend:seaweedfs:cov

      - name: Upload SeaweedFS integration coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: integration-seaweedfs-account-backend
          files: coverage/apps/account-backend-seaweedfs-integration/lcov.info,coverage/apps/account-backend-seaweedfs-integration/coverage-final.json,coverage/apps/account-backend-seaweedfs-integration/clover.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r apps/account-backend/scripts/requirements.txt

      - name: Run Python tests with coverage
        run: |
          mkdir -p coverage/apps/account-backend-python
          python -m coverage run --source=apps/account-backend/scripts --omit='apps/account-backend/scripts/*_test.py,apps/account-backend/scripts/test_pdf_verification.py' -m unittest discover -s apps/account-backend/scripts -p '*_test.py'
          python -m coverage xml -o coverage/apps/account-backend-python/coverage.xml

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: python-account-backend
          files: coverage/apps/account-backend-python/coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  coverage-tests:
    name: Coverage tests (${{ matrix.project }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project:
          - account-backend
          - account-frontend
          - cookie-banner

    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Run coverage tests
        run: bunx nx run ${{ matrix.project }}:test-cov

      - name: Collect coverage reports
        id: coverage
        shell: bash
        run: |
          if [ ! -d coverage ]; then
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t reports < <(find coverage -type f \( -name 'lcov.info' -o -name 'coverage-final.json' -o -name 'coverage.xml' -o -name 'clover.xml' \) | sort)

          if [ "${#reports[@]}" -eq 0 ]; then
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          reports_csv="$(IFS=,; echo "${reports[*]}")"
          echo "has_reports=true" >> "$GITHUB_OUTPUT"
          echo "files=$reports_csv" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        if: steps.coverage.outputs.has_reports == 'true'
        uses: codecov/codecov-action@v6
        with:
          flags: unit-${{ matrix.project }}
          files: ${{ steps.coverage.outputs.files }}
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build apps and libraries
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Build apps and libraries
        run: bunx nx run-many --target=build --projects=account-frontend,account-backend,m2m-contracts,account-privacy,cookie-banner,shared-types,shared-utils --parallel=3

  checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    needs:
      - lint
      - unit-tests
      - backend-e2e
      - backend-auth-e2e
      - backend-seaweedfs-integration
      - python-tests
      - coverage-tests
      - build

    permissions:
      contents: read

    if: >
      always() &&
      (
        github.event_name == 'push' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )

    steps:
      - name: Check parallel job results
        shell: bash
        run: |
          if [ '${{ needs.lint.result }}' != 'success' ] ||
            [ '${{ needs.unit-tests.result }}' != 'success' ] ||
            [ '${{ needs.backend-e2e.result }}' != 'success' ] ||
            [ '${{ needs.backend-auth-e2e.result }}' != 'success' ] ||
            [ '${{ needs.backend-seaweedfs-integration.result }}' != 'success' ] ||
            [ '${{ needs.python-tests.result }}' != 'success' ] ||
            [ '${{ needs.coverage-tests.result }}' != 'success' ] ||
            [ '${{ needs.build.result }}' != 'success' ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi

  prepare-untrusted-pr:
    name: Prepare untrusted PR dependencies
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect sensitive file changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1

          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"

          echo "$changed_files"

          if echo "$changed_files" | grep -E '(^\.github/workflows/.*\.ya?ml$|(^|/)(package\.json|bun\.lock|\.npmrc|bunfig\.toml)$|^apps/account-backend/prisma/|^apps/account-backend/prisma\.config\.ts$)'; then
            echo "::error::Fork PR changed CI/CD, dependency, or auth-related files."
            echo "::error::A maintainer must review this and run full CI from a trusted branch."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Remove package registry auth material
        run: |
          rm -f ~/.bunfig.toml
          rm -f ~/.npmrc
          rm -f bunfig.toml
          rm -f .npmrc

      - name: Upload prepared dependencies
        uses: actions/upload-artifact@v6
        with:
          name: untrusted-pr-node-modules
          path: |
            node_modules
            apps/**/node_modules
            libs/**/node_modules
          retention-days: 1
          include-hidden-files: false

  untrusted-pr-lint:
    name: Untrusted PR lint
    runs-on: ubuntu-latest

    needs:
      - prepare-untrusted-pr

    permissions:
      contents: read

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download prepared dependencies
        uses: actions/download-artifact@v6
        with:
          name: untrusted-pr-node-modules
          path: .

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Derive Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Lint affected projects
        run: bunx nx affected -t eslint:lint --parallel=3

  untrusted-pr-unit-tests:
    name: Untrusted PR unit tests
    runs-on: ubuntu-latest

    needs:
      - prepare-untrusted-pr

    permissions:
      contents: read

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download prepared dependencies
        uses: actions/download-artifact@v6
        with:
          name: untrusted-pr-node-modules
          path: .

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Derive Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Run affected unit tests
        run: bunx nx affected -t test --parallel=3

  untrusted-pr-backend-e2e:
    name: Untrusted PR backend E2E
    runs-on: ubuntu-latest

    needs:
      - prepare-untrusted-pr

    permissions:
      contents: read

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download prepared dependencies
        uses: actions/download-artifact@v6
        with:
          name: untrusted-pr-node-modules
          path: .

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Run mocked backend e2e tests
        run: bunx nx e2e account-backend

  untrusted-pr-backend-auth-e2e:
    name: Untrusted PR backend auth E2E
    runs-on: ubuntu-latest

    needs:
      - prepare-untrusted-pr

    permissions:
      contents: read

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download prepared dependencies
        uses: actions/download-artifact@v6
        with:
          name: untrusted-pr-node-modules
          path: .

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Run backend auth e2e tests with fresh Keycloak
        run: bun run e2e:backend:keycloak

  untrusted-pr-backend-seaweedfs-integration:
    name: Untrusted PR backend SeaweedFS integration
    runs-on: ubuntu-latest

    needs:
      - prepare-untrusted-pr

    permissions:
      contents: read

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download prepared dependencies
        uses: actions/download-artifact@v6
        with:
          name: untrusted-pr-node-modules
          path: .

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Run SeaweedFS integration tests
        run: bun run integration:backend:seaweedfs

  untrusted-pr-python-tests:
    name: Untrusted PR Python tests
    runs-on: ubuntu-latest

    needs:
      - prepare-untrusted-pr

    permissions:
      contents: read

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r apps/account-backend/scripts/requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s apps/account-backend/scripts -p '*_test.py'

  untrusted-pr-build:
    name: Untrusted PR build
    runs-on: ubuntu-latest

    needs:
      - prepare-untrusted-pr

    permissions:
      contents: read

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download prepared dependencies
        uses: actions/download-artifact@v6
        with:
          name: untrusted-pr-node-modules
          path: .

      - name: Generate Prisma client
        run: bunx prisma generate --schema apps/account-backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

      - name: Build apps and libraries
        run: bunx nx run-many --target=build --projects=account-frontend,account-backend,m2m-contracts,account-privacy,cookie-banner,shared-types,shared-utils --parallel=3

  untrusted-pr-checks:
    name: Untrusted PR checks
    runs-on: ubuntu-latest

    needs:
      - untrusted-pr-lint
      - untrusted-pr-unit-tests
      - untrusted-pr-backend-e2e
      - untrusted-pr-backend-auth-e2e
      - untrusted-pr-backend-seaweedfs-integration
      - untrusted-pr-python-tests
      - untrusted-pr-build

    permissions:
      contents: read

    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Check parallel job results
        shell: bash
        run: |
          if [ '${{ needs.untrusted-pr-lint.result }}' != 'success' ] ||
            [ '${{ needs.untrusted-pr-unit-tests.result }}' != 'success' ] ||
            [ '${{ needs.untrusted-pr-backend-e2e.result }}' != 'success' ] ||
            [ '${{ needs.untrusted-pr-backend-auth-e2e.result }}' != 'success' ] ||
            [ '${{ needs.untrusted-pr-backend-seaweedfs-integration.result }}' != 'success' ] ||
            [ '${{ needs.untrusted-pr-python-tests.result }}' != 'success' ] ||
            [ '${{ needs.untrusted-pr-build.result }}' != 'success' ]; then
            echo "::error::One or more untrusted PR CI jobs failed."
            exit 1
          fi
